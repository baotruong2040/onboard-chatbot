[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-console"
version = "0.1.0"
description = "Chatbot onboarding tiếng Việt chạy trên console"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
onboarding = "onboarding.cli:main"

[tool.setuptools.packages.find]
include = ["onboarding*"]
