[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-console"
version = "0.1.0"
description = "Chatbot onboarding tiếng Việt chạy trên console"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
onboarding = "onboarding.cli:main"

[tool.setuptools.packages.find]
include = ["onboarding*"]

[tool.setuptools.package-data]
onboarding = ["web/*.html", "web/*.css", "web/*.js"]
